<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MolPlatform · Tamarind 云端计算</title><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#1f2937;background:#f4f7fb}body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:white;border:1px solid #e3e9f1;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #1d35570a}h1{font-size:25px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd6e2;border-radius:8px;font:inherit}textarea{min-height:180px;font-family:ui-monospace,monospace}button{background:#244b78;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}button.secondary{background:#e9eff6;color:#26384b}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:11px;border-radius:8px;background:#fff7e6;color:#79520a;font-size:13px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;border-radius:8px;padding:12px;font-size:13px;max-height:360px;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:12px}}
</style></head><body><div class="wrap"><p class="muted"><a href="/workbench">← 返回 MolPlatform Workbench</a> · Tamarind Bio REST</p><h1>云端计算控制台</h1><p class="muted">本页面只操作你已配置在 WSL 后端 .env 中的 Tamarind API Key，不会在浏览器保存或展示该密钥。</p>
<div class="card"><h2>连接与工具发现</h2><div class="grid"><div><label>MolPlatform API Token（如已配置）</label><input id="token" type="password" placeholder="与 .env 中 API_TOKEN 一致；开发模式可留空"></div><div><label>工具筛选关键词（可选）</label><input id="search" placeholder="例如 alphafold、boltz、docking"></div></div><div class="row"><button id="health">检查 Tamarind 连接</button><button id="refresh" class="secondary">刷新工具目录</button></div><p id="connection" class="muted">尚未检查连接</p></div>
<div class="card"><h2>选择工具与参数</h2><div class="grid"><div><label>账户可用工具</label><select id="tool"><option value="">请先刷新工具目录</option></select><label>工具参数 JSON（以工具 schema 为准）</label><textarea id="settings">{
  "sequence": "MKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQ"
}</textarea></div><div><label>Job name（可选）</label><input id="jobname" placeholder="molplatform-demo"><label>Project tag（可选）</label><input id="tag" placeholder="文献复现 / 项目名称"><label>Schema / 参数定义</label><div id="schema" class="result">选择工具后显示 schema</div></div></div><div class="row"><button id="validate">仅验证参数（不提交计算）</button><button id="submit" disabled>确认后提交云端任务</button></div><p class="notice">安全提示：验证通过不代表计算已提交。只有点击“确认后提交云端任务”，并在浏览器二次确认后，才会向 Tamarind 提交任务；这可能消耗额度或产生费用。</p><div id="validation" class="result">等待验证</div></div>
<div class="card"><h2>任务状态与结果</h2><div class="row"><input id="lookup" placeholder="输入 Job name 查询状态" style="flex:1;min-width:220px"><button id="status">查询状态</button><button id="result" class="secondary">获取结果信息</button><button id="download" class="secondary">下载结果 ZIP</button></div><div id="job" class="result">尚无任务</div></div></div>
<script>
const $=id=>document.getElementById(id);let valid=false;const base='/api/v4/tamarind';function headers(json=true){let h={};let t=$('token').value.trim();if(t)h['X-API-Token']=t;if(json)h['Content-Type']='application/json';return h}async function req(path,opt={}){let r=await fetch(base+path,{...opt,headers:{...headers(!(opt.body instanceof FormData)),...(opt.headers||{})}});let ct=r.headers.get('content-type')||'';if(!r.ok){let v=ct.includes('json')?await r.json():await r.text();throw new Error(v.detail||v.message||JSON.stringify(v))}if(ct.includes('application/zip')){let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tamarind-results.zip';a.click();URL.revokeObjectURL(u);return {downloaded:true}}return ct.includes('json')?r.json():r.text()}function show(id,v){$(id).textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}function invalidate(){valid=false;$('submit').disabled=true}
$('health').onclick=async()=>{try{show('connection',await req('/health'))}catch(e){show('connection',e.message)}};
$('refresh').onclick=async()=>{try{let x=await req('/tools?search='+encodeURIComponent($('search').value));$('tool').innerHTML=x.tools.map(t=>`<option value="${String(t.name).replace(/"/g,'&quot;')}">${t.displayName||t.name}</option>`).join('')||'<option value="">没有匹配工具</option>';if(x.tools.length)$('tool').dispatchEvent(new Event('change'));show('connection',`已加载 ${x.count} 个工具`)}catch(e){show('connection',e.message)}};
$('tool').onchange=async()=>{invalidate();let n=$('tool').value;if(!n)return;try{show('schema',await req('/tools/'+encodeURIComponent(n)+'/schema'))}catch(e){show('schema',e.message)}};$('settings').oninput=invalidate;
$('validate').onclick=async()=>{invalidate();try{let body={tool_type:$('tool').value,settings:JSON.parse($('settings').value),job_name:$('jobname').value||null};let v=await req('/validate',{method:'POST',body:JSON.stringify(body)});show('validation',v);valid=!!v.valid&&!(v.mutatedFields||[]).length;$('submit').disabled=!valid;if(valid)show('validation',{...v,_note:'参数验证通过。尚未提交计算。'})}catch(e){show('validation',e.message)}};
$('submit').onclick=async()=>{if(!valid)return;if(!confirm('即将向 Tamarind 提交真实云端计算任务。该操作可能消耗账户额度或产生费用。确认提交？'))return;try{let body={tool_type:$('tool').value,settings:JSON.parse($('settings').value),job_name:$('jobname').value||null,project_tag:$('tag').value||null,require_validation:true};let r=await req('/jobs',{method:'POST',body:JSON.stringify(body)});$('lookup').value=r.job_name;show('job',r);invalidate()}catch(e){show('job',e.message)}};
$('status').onclick=async()=>{try{show('job',await req('/jobs/'+encodeURIComponent($('lookup').value)))}catch(e){show('job',e.message)}};$('result').onclick=async()=>{try{show('job',await req('/jobs/'+encodeURIComponent($('lookup').value)+'/result',{method:'POST',body:'{}'}))}catch(e){show('job',e.message)}};$('download').onclick=async()=>{try{let r=await req('/jobs/'+encodeURIComponent($('lookup').value)+'/download',{method:'POST',body:'{}'});if(!r.downloaded)show('job',r)}catch(e){show('job',e.message)}};
</script></body></html>
